name: sazinotech_app
description: اپلیکیشن سازینوتک - پنل مشتری و ادمین
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.6

  # HTTP & Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # State Management
  provider: ^6.1.1

  # Storage & Security
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

  # File & Image
  image_picker: ^1.0.5
  file_picker: ^6.1.1
  cached_network_image: ^3.3.0
  path_provider: ^2.1.1

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  shimmer: ^3.0.0

  # Splash & Icons
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

  # Utilities
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700